apis:
  - method: GET
    path: /api/ai-geo/overview
    permission_code: /ai-geo/dashboard
  - method: GET
    path: /api/ai-geo/materials/brands
    permission_code: /ai-geo/data/brands
  - method: POST
    path: /api/ai-geo/materials/brands
    permission_code: ai_geo:data:import
    audit: true
  - method: PUT
    path: /api/ai-geo/materials/brands/:id
    permission_code: ai_geo:data:import
    audit: true
  - method: GET
    path: /api/ai-geo/materials/products
    permission_code: /ai-geo/data/products
  - method: POST
    path: /api/ai-geo/materials/products
    permission_code: ai_geo:data:import
    audit: true
  - method: GET
    path: /api/ai-geo/materials/skus
    permission_code: /ai-geo/data/products
  - method: POST
    path: /api/ai-geo/materials/skus
    permission_code: ai_geo:data:import
    audit: true
  - method: GET
    path: /api/ai-geo/materials/competitors
    permission_code: /ai-geo/data/products
  - method: POST
    path: /api/ai-geo/materials/competitors
    permission_code: ai_geo:data:import
    audit: true
  - method: POST
    path: /api/ai-geo/materials/imports
    permission_code: ai_geo:data:import
    audit: true
  - method: GET
    path: /api/ai-geo/materials/imports/:id/errors
    permission_code: /ai-geo/data/products
  - method: POST
    path: /api/ai-geo/workbench/drafts/generate
    permission_code: ai_geo:workbench:generate
    audit: true
  - method: GET
    path: /api/ai-geo/drafts
    permission_code: /ai-geo/drafts
  - method: POST
    path: /api/ai-geo/drafts
    permission_code: ai_geo:draft:manage
    audit: true
  - method: POST
    path: /api/ai-geo/drafts/:id/submit
    permission_code: ai_geo:draft:manage
    audit: true
  - method: POST
    path: /api/ai-geo/drafts/:id/approve
    permission_code: ai_geo:draft:manage
    audit: true
  - method: POST
    path: /api/ai-geo/drafts/:id/reject
    permission_code: ai_geo:draft:manage
    audit: true
  - method: GET
    path: /api/ai-geo/drafts/:id/audit-suggestions
    permission_code: /ai-geo/drafts
  - method: POST
    path: /api/ai-geo/drafts/:id/audit-suggestions
    permission_code: ai_geo:draft:manage
    audit: true
  - method: POST
    path: /api/ai-geo/drafts/:id/channel-contents
    permission_code: ai_geo:channel_content:manage
    audit: true
  - method: GET
    path: /api/ai-geo/channel-contents/:id/audit-suggestions
    permission_code: /ai-geo/drafts
  - method: POST
    path: /api/ai-geo/channel-contents/:id/audit-suggestions
    permission_code: ai_geo:channel_content:manage
    audit: true
  - method: GET
    path: /api/ai-geo/publish-plans
    permission_code: /ai-geo/plans/queue
  - method: POST
    path: /api/ai-geo/publish-plans
    permission_code: ai_geo:publish_plan:manage
    audit: true
  - method: PATCH
    path: /api/ai-geo/publish-plans/:id/status
    permission_code: ai_geo:publish_plan:manage
    audit: true
  - method: GET
    path: /api/ai-geo/channels
    permission_code: /ai-geo/channels/profiles
  - method: POST
    path: /api/ai-geo/channels
    permission_code: ai_geo:channel:manage
    audit: true
  - method: GET
    path: /api/ai-geo/channel-accounts
    permission_code: /ai-geo/channels/accounts
  - method: POST
    path: /api/ai-geo/channel-accounts
    permission_code: ai_geo:channel_account:manage
    audit: true
package_features:
  - feature_code: ai_geo_access
    feature_name: AI GEO 应用访问
    feature_type: APP
    menu_code: ai_geo_root
    description: 允许租户访问 GEO 内容增长应用
  - feature_code: ai_geo_dashboard
    feature_name: 总览驾驶舱
    feature_type: MENU
    menu_code: ai_geo_dashboard
    description: 查看资料、母稿、发布计划和渠道接入状态
  - feature_code: ai_geo_workbench
    feature_name: AI 创作工作台
    feature_type: MENU
    menu_code: ai_geo_workbench
    description: 基于品牌、商品、SKU、Skill 和热点生成母稿
  - feature_code: ai_geo_drafts
    feature_name: 母稿与渠道内容
    feature_type: MENU
    menu_code: ai_geo_drafts
    description: 管理母稿资产、渠道版本、审核和预览
  - feature_code: ai_geo_plans
    feature_name: 发布计划
    feature_type: MENU
    menu_code: ai_geo_plans
    description: 管理发布日历与发布队列
  - feature_code: ai_geo_plan_calendar
    feature_name: 发布日历
    feature_type: MENU
    menu_code: ai_geo_plan_calendar
    description: 按日期查看发布任务
  - feature_code: ai_geo_plan_queue
    feature_name: 发布队列
    feature_type: MENU
    menu_code: ai_geo_plan_queue
    description: 执行发布前置检查和发布任务管理
  - feature_code: ai_geo_channels
    feature_name: 渠道管理模块
    feature_type: MENU
    menu_code: ai_geo_channels
    description: 管理渠道资料与渠道账号
  - feature_code: ai_geo_channel_profiles
    feature_name: 渠道资料
    feature_type: MENU
    menu_code: ai_geo_channel_profiles
    description: 维护渠道类型、发布入口、内容形态和规则
  - feature_code: ai_geo_channel_accounts
    feature_name: 渠道账号
    feature_type: MENU
    menu_code: ai_geo_channel_accounts
    description: 管理渠道授权账号、登录态和发布权限
  - feature_code: ai_geo_data
    feature_name: 资料中心
    feature_type: MENU
    menu_code: ai_geo_data
    description: 管理品牌、商品、SKU、竞品、关键词和素材
  - feature_code: ai_geo_brand_cards
    feature_name: 品牌资料卡
    feature_type: MENU
    menu_code: ai_geo_brand_cards
    description: 维护品牌定位、目标人群、价格带和内容口径
  - feature_code: ai_geo_product_cards
    feature_name: 商品资料卡
    feature_type: MENU
    menu_code: ai_geo_product_cards
    description: 维护商品公共资料、SKU、SKU 覆盖和竞品信息
quotas:
  - quota_code: ai_geo_brand_count
    quota_name: 品牌资料卡数量
    quota_type: STATIC
    unit: 个
    include_in_package: true
    description: 限制租户可维护的品牌资料卡数量
  - quota_code: ai_geo_product_count
    quota_name: 商品资料卡数量
    quota_type: STATIC
    unit: 个
    include_in_package: true
    description: 限制租户可维护的商品资料卡数量
  - quota_code: ai_geo_monthly_draft_generations
    quota_name: 月度母稿生成次数
    quota_type: PERIODIC
    unit: 次/月
    period_type: MONTH
    include_in_package: true
    description: 限制每月通过工作台生成母稿的次数
  - quota_code: ai_geo_monthly_publish_tasks
    quota_name: 月度发布任务数量
    quota_type: PERIODIC
    unit: 次/月
    period_type: MONTH
    include_in_package: true
    description: 限制每月创建发布计划任务的数量
  - quota_code: ai_geo_channel_account_count
    quota_name: 渠道账号数量
    quota_type: STATIC
    unit: 个
    include_in_package: true
    description: 限制租户可配置的渠道账号数量
