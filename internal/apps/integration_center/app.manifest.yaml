package_features:
  - feature_code: integration_tenant_authorization
    feature_name: 第三方集成授权连接
    feature_type: FEATURE
    source_code: integration_my_connections
    package_policy: IN_PACKAGE
    include_in_package: true
    description: 租户侧通过平台服务商应用创建第三方授权连接实例
  - feature_code: integration_data_sync
    feature_name: 第三方数据同步
    feature_type: FEATURE
    parent_code: integration_tenant_authorization
    source_code: integration_sync_monitor
    package_policy: IN_PACKAGE
    include_in_package: true
    description: 第三方平台订单、组织、成员、商品等数据进入数据中心和 Agent 数据源
quotas:
  - quota_code: integration_connection_count
    quota_name: 第三方连接实例数
    quota_type: STATIC
    unit: COUNT
    period_type: NONE
    include_in_package: true
    description: 单个租户可创建的第三方连接实例数量
  - quota_code: integration_api_calls_daily
    quota_name: 第三方接口日调用量
    quota_type: CONSUMABLE
    unit: TIMES
    period_type: DAY
    include_in_package: true
    description: 单个租户第三方接口每日调用总量
  - quota_code: integration_sync_records_daily
    quota_name: 第三方同步日记录数
    quota_type: CONSUMABLE
    unit: RECORDS
    period_type: DAY
    include_in_package: true
    description: 单个租户第三方同步任务每日写入记录总量
