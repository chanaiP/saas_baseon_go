manifest_version: "1.0"
fragment_role: main
app:
  app_code: integration-center
  app_name: 第三方集成中心
  app_type: CONNECTOR_APP
  source: BUILTIN
  status: ONLINE
  icon: Connection
  deployment_mode: MERGED
  communication_modes:
    - PLATFORM_API
    - WEBHOOK
    - DATA_SYNC
    - GATEWAY_PROXY
  visibility_scope: TENANT
  charge_policy: PAID
  billing_mode: SUBSCRIPTION
  package_policy: IN_PACKAGE
  version: 0.1.0
  description: 外部平台、服务商应用、授权连接实例、同步任务、配额限流、异常和调用日志的统一治理入口
  backend_dir: internal/apps/integration_center
  frontend_dir: frontend/src/apps/integration-center
clients:
  - PC_WEB
  - API_ONLY
